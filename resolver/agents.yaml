# resolver/agents.yaml
#
# SP-10 Confer fleet registry — the SINGLE SOURCE OF TRUTH for which Confer
# OpenClaw agents exist, what they do, and who they escalate to. Consumed at
# `bun run gen:skill-docs` time by scripts/resolvers/confer-agents.ts to render
# the {{CONFER_FLEET}} and {{ESCALATION_CHAIN}} placeholders into fleet-aware
# skills.
#
# Why a declarative YAML (not inline TS)?
#   - Rebase-safe: this file is Confer-only and never collides with upstream
#     garrytan/gstack. Editing the roster does not touch any upstream source.
#   - The resolver is host-gated: if this file is absent (e.g. an upstream
#     checkout, or a non-Confer host), the resolver is a NO-OP and the two
#     placeholders resolve to empty string — exactly like gbrain's resolvers
#     suppress on non-brain hosts. Upstream skill output is never altered.
#
# Org-hierarchy model mirrors Confer's gbrain federated_read tiers:
#   - tier `admin`        → gbrain_sources ["*"] (full read), escalates to human
#   - tier `t1`           → trusted-1: broad read, may include write
#   - tier `t1+client`    → trusted-1 scoped to a specific client engagement
#   - tier `odyssey-only` → scoped strictly to the Odyssey (ODC) engagement
#   - tier `personal-exec`→ Yatin's personal executive surface
#   - tier `property`     → Confer-owned infra/property agent (ops/monitoring/voice)
# `gbrain_sources` lists the federated_read source scopes an agent may read.
# `escalates_to` names the agent (or `human`) this agent reports blockers to;
# the {{ESCALATION_CHAIN}} placeholder walks this until it reaches `human`.
#
# Roster reconciled 2026-05-29 against the canonical registry
#   ~/Agent-Ops/30-Agent-Fleet/OpenClaw-Agent-Registry.md and
#   ~/Agent-Ops/30-Agent-Fleet/FLEET-HIERARCHY-OVERVIEW.md.
# Agents the canonical sources mark DELETED (the 2026-05-24 Temple cleanup:
# Denali, Aspen, Cliff, Cedar/-1..4, Sierra, Ridge, Pine, Granite, Beacon/-1,
# Brahma) are intentionally NOT listed — they no longer exist on the fleet.
# Where a client assignment is genuinely unknown it is recorded as `<tbd>`
# with a `# TODO: confirm` comment rather than guessed.

version: 1

defaults:
  # gbrain federated_read endpoint the fleet reads from. Override per-agent if
  # an agent ever points at a different brain.
  gbrain_url: https://gbrain.confer.today
  # Default escalation target when an agent declares none.
  escalates_to: aether

